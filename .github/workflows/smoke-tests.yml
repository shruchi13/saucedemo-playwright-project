name: Playwright Behave Smoke Tests 
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
    smoke-tests:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
           python-version: '3.12'

        - name: Install dependencies
          run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
           pip install playwright behave

        - name: Install Playwright browsers & dependencies
          run: |
            playwright install --with-deps chromium

        - name: Create Reports Directory
          run: mkdir -p reports
        
        - name: Run Smoke Tests with HTML Report
          run: |
            behave  --tags=@smoke\
            -f behave_html_formatter:HTMLFormatter \
            -o reports/smoke_test_report.html \
            -f pretty 

        - name: Upload HTML Test Report
          if: always() # Upload the report whether the tests pass or fail
          uses: actions/upload-artifact@v4
          with:
            name: smoke-test-html-report
            path: reports/smoke_test_report.html
    